name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test (real system calls on this OS)
        continue-on-error: true
        shell: bash
        run: |
          cd desktop && python -X utf8 -c "
          import sys, speak
          P = speak.Windows if sys.platform == 'win32' else speak.Mac
          p = P(lambda: 0, lambda: 0)
          print('mouse', p.mouse(), 'ibeam', p.ibeam())
          p.show(100, 100); p.say('test 测试'); p.root.update(); print('box', p.box()); p.hide()
          v = speak.voice('plaid'); print('voice', v); print('mean', speak.lookup('plaid'))
          if v: p.play(v); p.stop()
          print('SMOKE OK')"
      - run: pip install pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name earImmersion desktop/speak.py
          cp dist/earImmersion.exe earImmersion-${{ matrix.name }}.exe
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --name earImmersion --osx-bundle-identifier io.github.earimmersion desktop/speak.py
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/earImmersion.app/Contents/Info.plist
          codesign --force --deep -s - dist/earImmersion.app
          ditto -c -k --keepParent dist/earImmersion.app earImmersion-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: earImmersion-${{ matrix.name }}
          path: earImmersion-${{ matrix.name }}.*
      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" earImmersion-${{ matrix.name }}.* --clobber
      - name: Pack extension
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd extension && 7z a ../earImmersion-extension.zip . && cd ..
          gh release upload "$GITHUB_REF_NAME" earImmersion-extension.zip --clobber
